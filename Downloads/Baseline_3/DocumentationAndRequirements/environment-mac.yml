name: engagement-mas-mac
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=1.26.*
  - pandas=2.2.*
  - pyyaml=6.0.*
  - tqdm=4.66.*
  - scikit-learn=1.5.*
  - pytest=8.*
  - pillow=10.*
  - pip:
      - setuptools>=70,<81
      - numpy<2
      - torch==2.2.*
      - torchvision==0.17.*
      - torchaudio==2.2.*
      - pytorch-lightning==2.2.*
      - torchmetrics==1.4.*
      - hydra-core==1.3.*
      - omegaconf==2.3.*
      - timm==0.9.*
      - mediapipe==0.10.*
# Conda environment for developing and inference on macOS ARM (M1/M2/M3) using CPU/MPS backend. No CUDA packages are included.
